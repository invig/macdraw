name: MacDraw
options:
  bundleIdPrefix: local.macdraw
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  MacDraw:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macdraw.MacDraw
        PRODUCT_NAME: MacDraw
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacDraw
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Editor: Excalidraw (MIT License)"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Excalidraw Drawing
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.excalidraw.scene]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ExcalidrawDocument
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.excalidraw.scene
            UTTypeDescription: Excalidraw Drawing
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [excalidraw]
              public.mime-type: [application/vnd.excalidraw+json]
    dependencies:
      - target: WebBundle
      - target: MacDrawThumbnail
      - target: MacDrawPreview
    preBuildScripts:
      - name: Copy web editor
        script: "\"$SRCROOT/scripts/copy-web.sh\""
        basedOnDependencyAnalysis: false
        showEnvVars: false

  MacDrawThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook/Thumbnail
      - path: QuickLook/Shared
      - path: App/Sources/BundleSchemeHandler.swift
    dependencies:
      - target: WebBundle
      - sdk: QuickLookThumbnailing.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macdraw.MacDraw.Thumbnail
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuickLook/Thumbnail/Info.plist
        SKIP_INSTALL: YES
    info:
      path: QuickLook/Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: MacDraw Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.excalidraw.scene]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: QuickLook/Thumbnail/Thumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true  # WebKit's helper processes need it, even offline
    preBuildScripts:
      - name: Copy web renderer
        script: "\"$SRCROOT/scripts/copy-web.sh\" --no-cjk"
        basedOnDependencyAnalysis: false
        showEnvVars: false

  MacDrawPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook/Preview
      - path: QuickLook/Shared
      - path: App/Sources/BundleSchemeHandler.swift
    dependencies:
      - target: WebBundle
      - sdk: QuickLookUI.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macdraw.MacDraw.Preview
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuickLook/Preview/Info.plist
        SKIP_INSTALL: YES
    info:
      path: QuickLook/Preview/Info.plist
      properties:
        CFBundleDisplayName: MacDraw Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes: [com.excalidraw.scene]
            QLSupportsSearchableItems: false
    entitlements:
      path: QuickLook/Preview/Preview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
    preBuildScripts:
      - name: Copy web renderer
        script: "\"$SRCROOT/scripts/copy-web.sh\" --no-cjk"
        basedOnDependencyAnalysis: false
        showEnvVars: false

aggregateTargets:
  WebBundle:
    buildScripts:
      - name: Build web bundle
        script: "\"$SRCROOT/scripts/build-web.sh\""
        basedOnDependencyAnalysis: false
        showEnvVars: false
